[project]
name = "spatiotemporal-earthquake-probabilistic-prediction-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kope", email = "keshavpsdneupane@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "rasterio>=1.5.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "skorch>=1.4.0",
    "torch>=2.14.1",
    "xgboost>=3.4.1",
]

[project.scripts]
spatiotemporal-earthquake-probabilistic-prediction-system = "spatiotemporal_earthquake_probabilistic_prediction_system:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
